run:
  project_root: .
  model_name: online-ppo
  reproducibility:
    seed: 1010
    enforce_determinism: false
  execution:
    device: cpu
  recovery:
    resume:
      policy: if_exists
      mode: exact
environments:
  control:
    factory: sequifier.rl.control:CategoricalControlAdapter
    config:
      horizon: 8
phases:
  online_control:
    algorithm: ppo
    optimization_epochs: 4
    accumulation_batches: 1
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    evaluation:
      environment: control
      seeds:
      - 17
      - 29
      - 43
      - 71
      max_episode_steps: 8
      timeout_seconds: 30
      cadence:
        iterations: 2
      batch_size: 1
    batch_size: 64
    model_selection:
      handoff: last
    checkpoints:
      cadence:
        iterations: 2
    budget:
      env_steps: 8192
    collection:
      environment: control
      env_steps_per_iteration: 256
plan:
- online_control
