run:
  project_root: .
  model_name: dpo-control
  reproducibility:
    seed: 1010
    enforce_determinism: false
  execution:
    device: cpu
datasets:
  decisions:
    model_interface: actor
    sources:
      default:
        type: sequence
        paths:
        - data/control-decisions.csv
    partition:
      validation_fraction: 0.2
  rankings:
    sources:
      default:
        type: preferences
        manifest_path: data/control-preferences.json
    partition:
      validation_fraction: 0.2
phases:
  preferences:
    algorithm: dpo
    sources:
    - source: rankings.train
    beta: 0.1
    model_selection:
      handoff: last
    checkpoints:
      cadence:
        iterations: 1
    evaluation:
      cadence:
        iterations: 1
      batch_size: 1
      sources:
      - source: rankings.validation
    budget:
      iterations: 100
plan:
- preferences
