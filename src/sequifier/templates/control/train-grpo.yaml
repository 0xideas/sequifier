run:
  project_root: .
  model_name: grpo-control
  reproducibility:
    seed: 1010
    enforce_determinism: false
  execution:
    device: cpu
environments:
  control:
    factory: sequifier.rl.control:CategoricalControlAdapter
    config:
      horizon: 8
phases:
  group_improvement:
    algorithm: grpo
    evaluation:
      environment: control
      seeds:
      - 17
      - 29
      - 43
      - 71
      max_episode_steps: 8
      timeout_seconds: 30
      monitor:
        metric: score_mean
        direction: max
      cadence:
        iterations: 1
      batch_size: 1
    model_selection:
      handoff: last
    checkpoints:
      cadence:
        iterations: 1
    budget:
      groups: 32
    collection:
      environment: control
      max_steps: 8
      groups_per_iteration: 2
      group_size: 4
plan:
- group_improvement
