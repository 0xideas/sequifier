model:
  backbone:
    architecture:
      model_dim: 32
      num_layers: 1
      max_context_length: 4
      attention:
        num_heads: 4
      feed_forward:
        hidden_dim: 64
      position_encoding_scope: global
      dropout: 0.0
  interfaces:
    actor:
      input_columns:
      - cue
      - __policy_previous_action
      target_columns:
      - action
      ingestion:
        type: embedding
        output_dim: 8
        feature_embedding_dims:
          cue: 2
          __policy_previous_action: 6
      decoder:
        type: linear
        prediction_length: 1
        support_length: 1
      categorical_decoder_special_tokens:
        action: []
      input_contract:
        normalization:
          source: identity
  execution:
    context_length: 4
policy_bindings:
  actor:
    previous_action_inputs:
      __policy_previous_action: action
    initial_inputs:
      __policy_previous_action: start
    return_conditioned: false
    actions:
      action:
        type: categorical
        values:
        - left
        - right
