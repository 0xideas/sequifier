initialize_from: models/supervised.pt
policy_bindings:
  default:
    actions:
      mode:
        type: categorical
        values:
        - 'off'
        - 'on'
      quantity:
        type: real
        scale:
          fixed: 0.5
run:
  project_root: .
  model_name: posttrained
  reproducibility:
    seed: 1010
    enforce_determinism: false
  execution:
    device: cpu
  recovery:
    resume:
      policy: if_exists
      mode: reset_environments
datasets:
  demonstrations:
    sources:
      default:
        type: sequence
        paths:
        - data/demonstrations.parquet
        format: table
    partition:
      validation_fraction: 0.2
phases:
  imitation:
    algorithm: policy_imitation
    sources:
    - source: demonstrations.train
    model_selection:
      handoff: last
    checkpoints:
      cadence:
        iterations: 1
    evaluation:
      cadence:
        iterations: 1
      batch_size: 32
      sources:
      - source: demonstrations.validation
    budget:
      epochs: 5
plan:
- imitation
