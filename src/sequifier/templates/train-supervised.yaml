run:
  model_name: forecast
model:
  execution: {context_length: 48}
  backbone:
    architecture:
      model_dim: 64
      num_layers: 2
      attention: {num_heads: 4}
      feed_forward: {hidden_dim: 128}
  interfaces:
    series:
      input_columns: [value]
      target_columns: [value]
      ingestion: {type: embedding, output_dim: 64}
      decoder: {type: linear, prediction_length: 1}
datasets:
  events:
    sources:
      table: {type: prepared, metadata_config_path: configs/metadata_configs/events.json}
phases:
  fit:
    algorithm: supervised
    budget: {epochs: 10}
    sources: [{source: events.train}]
    learning:
      datasets:
        events:
          losses: {value: {criterion: MSELoss}}
    evaluation:
      sources: [{source: events.validation}]
plan: [fit]
