project_root: "."
model_name: supervised
device: cpu
global_training:
  training_objective: causal
  context_length: 48
  inference_batch_size: 10
model:
  backbone:
    architecture:
      model_dim: 128
      num_layers: 3
      attention:
        num_heads: 16
      feed_forward:
        hidden_dim: 128
      dropout: 0.2
  interfaces:
    default:
      input_columns:
      - EXAMPLE_INPUT_COLUMN_NAME
      target_columns:
      - EXAMPLE_TARGET_COLUMN_NAME
      ingestion:
        type: embedding
        output_dim: 128
      decoder:
        type: linear
        prediction_length: 1
training_plan:
  phases:
  - name: supervised
    algorithm: supervised
    epochs: 10
    mode: sequential
    sources:
    - source: default.default
    batch_size: 10
    accumulation_batches: 1
    optimization:
      model:
        learning_rate: 0.0001
        optimizer:
          name: AdamW
          arguments: {}
        scheduler:
          name: StepLR
          arguments:
            step_size: 1
            gamma: 0.99
        scheduler_step_on: epoch
    evaluation:
      sources:
      - source: default.default
export_generative_model: true
export_embedding_model: false
dataset_training:
  default:
    criterion:
      EXAMPLE_TARGET_COLUMN_NAME: MSELoss
    parts:
      default:
        metadata_config_path: PLEASE FILL
