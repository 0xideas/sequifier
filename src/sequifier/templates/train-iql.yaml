model:
  backbone:
    architecture:
      model_dim: 32
      num_layers: 2
      max_context_length: 16
      attention:
        num_heads: 4
      feed_forward:
        hidden_dim: 128
      position_encoding_scope: global
  interfaces:
    actor:
      input_columns:
      - OBSERVATION_COLUMN
      - __policy_previous_action
      target_columns:
      - action
      ingestion:
        type: embedding
        output_dim: 8
        feature_embedding_dims:
          OBSERVATION_COLUMN: 2
          __policy_previous_action: 6
      decoder:
        type: linear
        prediction_length: 1
        support_length: 1
      categorical_decoder_special_tokens:
        action: []
  execution:
    context_length: 16
policy_bindings:
  actor:
    return_conditioned: false
    actions:
      action:
        type: categorical
        values:
        - 0.0
        - 1.0
    feedback:
      __policy_previous_action:
        action: action
        initial: start
run:
  project_root: .
  model_name: offline-iql
  reproducibility:
    seed: 1010
    enforce_determinism: false
  execution:
    device: cpu
  recovery:
    resume:
      policy: if_exists
datasets:
  demonstrations:
    model_interface: actor
    sources:
      recorded:
        type: sequence
        paths:
        - PLEASE_FILL.csv
    partition:
      validation_fraction: 0.2
phases:
  offline_improvement:
    algorithm: iql
    sources:
    - source: demonstrations.train
    batch_size: 64
    model_selection:
      handoff: last
    checkpoints:
      cadence:
        iterations: 100
    evaluation:
      cadence:
        iterations: 100
      batch_size: 64
      sources:
      - source: demonstrations.validation
    budget:
      iterations: 10000
plan:
- offline_improvement
