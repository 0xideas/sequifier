project_root: "."
model_name: policy
device: cpu
seed: 1010
model:
  backbone:
    architecture:
      model_dim: 32
      num_layers: 2
      max_context_length: 4
      attention:
        num_heads: 4
      feed_forward:
        activation: swiglu
        hidden_dim: 128
      position_encoding_scope: global
      dropout: 0.0
  interfaces:
    actor:
      input_columns:
      - OBSERVATION_COLUMN
      - __policy_previous_action
      - __policy_return
      target_columns:
      - action
      ingestion:
        type: embedding
        output_dim: 8
        feature_embedding_dims:
          OBSERVATION_COLUMN: 1
          __policy_previous_action: 6
          __policy_return: 1
      decoder:
        type: linear
        prediction_length: 1
        support_length: 1
      categorical_decoder_special_tokens:
        action: []
report_path: outputs/policy/training-report.json
global_training:
  context_length: 4
  validation_fraction: 0.2
  episode_cache_size: 8
  resume:
    policy: never
dataset_training:
  demonstrations:
    parts:
      recorded:
        type: sequence
        paths:
        - data/demonstrations.parquet
    model_interface: actor
training_plan:
  phases:
  - name: offline_policy
    algorithm: policy_imitation
    epochs: 80
    sources:
    - source: demonstrations.recorded
    batch_size: 64
    optimization:
      actor:
        learning_rate: 0.005
policy_bindings:
  actor:
    previous_action_inputs:
      __policy_previous_action: action
    initial_inputs:
      __policy_previous_action: start
    return_conditioned: true
    returns:
      gamma: 1.0
      scale: 1.0
    actions:
      action:
        type: categorical
        values:
        - 0.0
        - 1.0
model_path: models/policy/actor.pt
