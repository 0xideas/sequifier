project_root: .
model_name: policy
device: cpu
seed: 1010

trajectory_sources:
  demonstrations:
    # Paths inside the manifest resolve relative to the manifest directory.
    manifest: data/trajectories/manifest.json
    action_semantics: policy

# Set observation columns and action values to match your recorded trajectories.
policies:
  actor:
    observation_columns: [OBSERVATION_COLUMN]
    action_column: action
    action_values: [0.0, 1.0]
    context_length: 4
    return_conditioned: true
    returns: {gamma: 1.0, scale: 1.0}
    backbone:
      dim_model: 32
      num_layers: 2
      max_context_length: 4
      attention: {n_heads: 4}
      feed_forward: {dim: 128, activation: swiglu}
      positional_encoding_scope: global
      dropout: 0.0

training_plan:
  phases:
    - name: offline_policy
      algorithm: return_conditioned
      epochs: 80
      trajectory_sources: [demonstrations]
      policy: actor

optimization:
  batch_size: 64
  learning_rate: 0.005
  gradient_clip: 1.0
  validation_fraction: 0.2
  optimizer: {name: Adam}
  scheduler: {name: ConstantLR, factor: 1.0, total_iters: 1}

actor_path: models/policy/actor.pt
report_path: outputs/policy/training-report.json
