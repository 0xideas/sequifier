project_root: .
model_name: policy
device: cpu
seed: 1010

data_sources:
  demonstrations:
    # One row per current observation/executed action/resulting reward.
    paths: [data/demonstrations.parquet]

# Set observation columns and action values to match your table.
policies:
  actor:
    observation_columns: [OBSERVATION_COLUMN]
    action_column: action
    action_values: [0.0, 1.0]
    context_length: 4
    return_conditioned: true
    returns: {gamma: 1.0, scale: 1.0}
    backbone:
      dim_model: 32
      num_layers: 2
      max_context_length: 4
      attention: {n_heads: 4}
      feed_forward: {dim: 128, activation: swiglu}
      positional_encoding_scope: global
      dropout: 0.0

training_plan:
  phases:
    - name: offline_policy
      algorithm: return_conditioned
      epochs: 80
      sources: [{source: demonstrations}]
      policy: actor

optimization:
  batch_size: 64
  num_workers: 0
  episode_cache_size: 8
  resume: {policy: never}
  learning_rate: 0.005
  gradient_clip: 1.0
  validation_fraction: 0.2
  optimizer: {name: Adam}
  scheduler: {name: ConstantLR, factor: 1.0, total_iters: 1}

model_path: models/policy/policy.pt
report_path: outputs/policy/training-report.json
