model:
  backbone:
    architecture:
      model_dim: 32
      num_layers: 2
      max_context_length: 4
      attention:
        num_heads: 4
      feed_forward:
        activation: swiglu
        hidden_dim: 128
      position_encoding_scope: global
      dropout: 0.0
  interfaces:
    actor:
      input_columns:
      - OBSERVATION_COLUMN
      - __policy_previous_action
      - __policy_return
      target_columns:
      - action
      ingestion:
        type: embedding
        output_dim: 8
        feature_embedding_dims:
          OBSERVATION_COLUMN: 1
          __policy_previous_action: 6
          __policy_return: 1
      decoder:
        type: linear
        prediction_length: 1
        support_length: 1
      categorical_decoder_special_tokens:
        action: []
  execution:
    context_length: 4
policy_bindings:
  actor:
    return_conditioned: true
    returns:
      gamma: 1.0
      scale: 1.0
    actions:
      action:
        type: categorical
        values:
        - 0.0
        - 1.0
    feedback:
      __policy_previous_action:
        action: action
        initial: start
run:
  project_root: .
  model_name: policy
  reproducibility:
    seed: 1010
    enforce_determinism: false
  execution:
    device: cpu
    offline:
      episode_cache_size: 8
  recovery:
    resume:
      policy: never
  outputs:
    model_path: models/policy/actor.pt
    report_path: outputs/policy/training-report.json
datasets:
  demonstrations:
    model_interface: actor
    sources:
      recorded:
        type: sequence
        paths:
        - data/demonstrations.parquet
    partition:
      validation_fraction: 0.2
phases:
  offline_policy:
    algorithm: policy_imitation
    sources:
    - source: demonstrations.train
    batch_size: 64
    optimization:
      actor:
        learning_rate: 0.005
    model_selection:
      handoff: last
    checkpoints:
      cadence:
        iterations: 1
    evaluation:
      cadence:
        iterations: 1
      batch_size: 64
      sources:
      - source: demonstrations.validation
    budget:
      epochs: 80
plan:
- offline_policy
