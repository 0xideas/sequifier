project_root: .
output_dir: outputs/numeric-policy
horizon: 3
repetitions: 16
context_length: 4
backbone:
  dim_model: 32
  num_layers: 2
  max_context_length: 4
  attention:
    type: mha
    n_heads: 4
  feed_forward:
    dim: 128
    activation: swiglu
  normalization:
    type: rmsnorm
    norm_first: true
  position_encoding:
    type: learned
  positional_encoding_scope: global
  dropout: 0.0
returns:
  gamma: 1.0
  scale: 1.0
training:
  epochs: 80
  batch_size: 64
  learning_rate: 0.005
  seed: 1010
  validation_fraction: 0.2
requested_returns: [0.0, 3.0]
sampling_episodes: 8
