model:
  backbone:
    architecture:
      model_dim: 32
      num_layers: 2
      max_context_length: 16
      attention:
        num_heads: 4
      feed_forward:
        hidden_dim: 128
      position_encoding_scope: global
  interfaces:
    actor:
      input_columns:
      - position
      - __policy_previous_action
      target_columns:
      - action
      ingestion:
        type: embedding
        output_dim: 8
        feature_embedding_dims:
          position: 2
          __policy_previous_action: 6
      decoder:
        type: linear
        prediction_length: 1
        support_length: 1
      categorical_decoder_special_tokens:
        action: []
  execution:
    context_length: 16
dataset_training:
  demonstrations:
    parts:
      recorded:
        type: sequence
        paths:
        - data/offline-transitions.csv
    model_interface: actor
    split:
      validation_fraction: 0.2
training_plan:
  phases:
  - name: behavior_cloning
    algorithm: policy_imitation
    sources:
    - source: demonstrations.recorded
    epochs: 30
    batch_size: 64
    model_selection:
      handoff: last
    checkpoints:
      cadence:
        iterations: 1
    evaluation:
      cadence:
        iterations: 1
      batch_size: 64
      before_phase: false
      on_snapshot: false
policy_bindings:
  actor:
    previous_action_inputs:
      __policy_previous_action: action
    initial_inputs:
      __policy_previous_action: start
    return_conditioned: false
    actions:
      action:
        type: categorical
        values:
        - left
        - right
run:
  project_root: .
  model_name: toy-bc
  reproducibility:
    seed: 1010
    enforce_determinism: false
  execution:
    device: cpu
    distribution:
      strategy: local
      world_size: 1
      backend: nccl
    precision: {}
    data_loading: {}
    compilation:
      torch_compile: none
  recovery: {}
  logging: {}
  outputs: {}
  export:
    onnx: false
    pt: true
    batch_size: 1
    generative_model: true
    embedding_model: false
    with_dropout: false
