project_root: .
model_name: toy-bc
device: cpu
seed: 1010
model:
  backbone:
    architecture:
      dim_model: 32
      num_layers: 2
      max_context_length: 16
      attention: {n_heads: 4}
      feed_forward: {dim: 128}
      positional_encoding_scope: global
  interfaces:
    actor:
      input_columns: [position]
      target_columns: [action]
      policy:
        observation_columns: [position]
        action_column: action
        action_values: [left, right]
        return_conditioned: false
      ingestion:
        type: embedding
        output_dim: 8
        feature_embedding_dims: {position: 2, __policy_previous_action: 6}
      decoder: {type: linear, prediction_length: 1, support: 1}
policy_interface: actor
context_length: 16
sources:
  demonstrations.recorded:
    paths: [data/offline-transitions.csv]
validation_fraction: 0.2
phases:
- name: behavior_cloning
  algorithm: policy_imitation
  sources: [demonstrations.recorded]
  epochs: 30
  batch_size: 64
  actor_learning_rate: 0.0003
