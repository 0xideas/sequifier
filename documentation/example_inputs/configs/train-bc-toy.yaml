project_root: .
model_name: toy-bc
device: cpu
seed: 1010
model:
  backbone:
    architecture:
      dim_model: 32
      num_layers: 2
      max_context_length: 16
      attention: {n_heads: 4}
      feed_forward: {dim: 128}
      positional_encoding_scope: global
  interfaces:
    actor:
      input_columns: [position]
      target_columns: [action]
      policy:
        observation_columns: [position]
        action_column: action
        action_values: [left, right]
        return_conditioned: false
      ingestion:
        type: embedding
        output_dim: 8
        feature_embedding_dims: {position: 1, __policy_previous_action: 6}
      decoder: {type: linear, prediction_length: 1, support: 1}
dataset_training:
  demonstrations:
    model_interface: actor
    parts:
      recorded: {paths: [data/offline-transitions.csv]}
global_training:
  training_objective: policy
  context_length: 16
  batch_size: 64
  learning_rate: 0.0003
  validation_fraction: 0.2
training_plan:
  phases:
    - name: behavior_cloning
      algorithm: policy_imitation
      policy: actor
      sources: [{source: demonstrations.recorded}]
      epochs: 30
