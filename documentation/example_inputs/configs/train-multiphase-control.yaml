model:
  backbone:
    architecture:
      model_dim: 32
      num_layers: 1
      max_context_length: 4
      attention:
        num_heads: 4
      feed_forward:
        hidden_dim: 64
      position_encoding_scope: global
      dropout: 0.0
  interfaces:
    actor:
      input_columns:
      - cue
      - __policy_previous_action
      target_columns:
      - action
      ingestion:
        type: embedding
        output_dim: 8
        feature_embedding_dims:
          cue: 2
          __policy_previous_action: 6
      decoder:
        type: linear
        prediction_length: 1
        support_length: 1
      categorical_decoder_special_tokens:
        action: []
      input_contract:
        normalization:
          source: identity
  execution:
    context_length: 4
policy_bindings:
  actor:
    return_conditioned: false
    actions:
      action:
        type: categorical
        values:
        - left
        - right
    feedback:
      __policy_previous_action:
        action: action
        initial: start
run:
  project_root: .
  model_name: multiphase-control
  reproducibility:
    seed: 1010
    enforce_determinism: false
  execution:
    device: cpu
datasets:
  decisions:
    model_interface: actor
    sources:
      default:
        type: sequence
        paths:
        - data/control-decisions.csv
    partition:
      validation_fraction: 0.2
  rankings:
    sources:
      default:
        type: preferences
        manifest_path: data/control-preferences.json
    partition:
      validation_fraction: 0.2
phases:
  imitation:
    algorithm: policy_imitation
    sources:
    - source: decisions.train
    model_selection:
      handoff: last
    checkpoints:
      cadence:
        iterations: 1
    evaluation:
      cadence:
        iterations: 1
      batch_size: 32
      sources:
      - source: decisions.validation
    budget:
      epochs: 4
  offline_improvement:
    algorithm: iql
    sources:
    - source: decisions.train
    model_selection:
      handoff: last
    checkpoints:
      cadence:
        iterations: 100
    evaluation:
      cadence:
        iterations: 100
      batch_size: 64
      sources:
      - source: decisions.validation
    budget:
      iterations: 100
  preferences:
    algorithm: dpo
    sources:
    - source: rankings.train
    beta: 0.1
    model_selection:
      handoff: last
    checkpoints:
      cadence:
        iterations: 1
    evaluation:
      cadence:
        iterations: 1
      batch_size: 1
      sources:
      - source: rankings.validation
    budget:
      iterations: 100
  group_improvement:
    algorithm: grpo
    evaluation:
      environment: control
      seeds:
      - 17
      - 29
      - 43
      - 71
      max_episode_steps: 8
      timeout_seconds: 30
      monitor:
        metric: score_mean
        direction: max
      cadence:
        iterations: 1
      batch_size: 1
    model_selection:
      handoff: last
    checkpoints:
      cadence:
        iterations: 1
    budget:
      groups: 32
    collection:
      environment: control
      max_steps: 8
      groups_per_iteration: 2
      group_size: 4
  ppo_improvement:
    algorithm: ppo
    optimization_epochs: 4
    accumulation_batches: 1
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    evaluation:
      environment: control
      seeds:
      - 17
      - 29
      - 43
      - 71
      max_episode_steps: 8
      timeout_seconds: 30
      cadence:
        iterations: 2
      batch_size: 1
    batch_size: 64
    model_selection:
      handoff: last
    checkpoints:
      cadence:
        iterations: 2
    budget:
      env_steps: 8192
    collection:
      environment: control
      env_steps_per_iteration: 256
environments:
  control:
    factory: sequifier.rl.control:CategoricalControlAdapter
    config:
      horizon: 8
plan:
- imitation
- offline_improvement
- preferences
- group_improvement
- ppo_improvement
