project_root: .
model_name: toy-iql
device: cpu
seed: 1010
initialize_from: models/toy-bc/toy-bc.pt
model:
  backbone:
    architecture:
      dim_model: 32
      num_layers: 2
      max_context_length: 16
      attention: {n_heads: 4}
      feed_forward: {dim: 128}
      positional_encoding_scope: global
  interfaces:
    actor:
      input_columns: [position]
      target_columns: [action]
      policy:
        observation_columns: [position]
        action_column: action
        action_values: [left, right]
        return_conditioned: false
      ingestion:
        type: embedding
        output_dim: 8
        feature_embedding_dims: {position: 2, __policy_previous_action: 6}
      decoder: {type: linear, prediction_length: 1, support: 1}
dataset_training:
  demonstrations:
    model_interface: actor
    parts:
      recorded:
        paths: [data/offline-transitions.csv]
        columns:
          reward: reward
          terminated: terminated
          truncated: truncated
          bootstrap_allowed: bootstrap_allowed
          successors: {position: next_position}
global_training:
  training_objective: policy
  context_length: 16
  batch_size: 64
  learning_rate: 0.005
  validation_fraction: 0.2
  resume: {policy: if_exists}
training_plan:
  phases:
    - name: offline_improvement
      algorithm: iql
      policy: actor
      sources: [{source: demonstrations.recorded}]
      updates: 10000
      batch_size: 64
      evaluation_interval: 100
      checkpoint_interval: 100
