model:
  backbone:
    architecture:
      model_dim: 32
      num_layers: 2
      max_context_length: 16
      attention:
        num_heads: 4
      feed_forward:
        hidden_dim: 128
      position_encoding_scope: global
  interfaces:
    actor:
      input_columns:
      - position
      - velocity
      - __policy_previous_action
      target_columns:
      - action
      ingestion:
        type: embedding
        output_dim: 8
        feature_embedding_dims:
          position: 1
          velocity: 1
          __policy_previous_action: 6
      decoder:
        type: linear
        prediction_length: 1
        support_length: 1
      categorical_decoder_special_tokens:
        action: []
  execution:
    context_length: 16
policy_bindings:
  actor:
    return_conditioned: false
    actions:
      action:
        type: categorical
        values:
        - left
        - right
    feedback:
      __policy_previous_action:
        action: action
        initial: start
run:
  project_root: .
  model_name: table-policy
  reproducibility:
    seed: 1010
    enforce_determinism: false
  execution:
    device: cpu
datasets:
  demonstrations:
    model_interface: actor
    sources:
      recorded:
        type: sequence
        paths:
        - data/demonstrations.parquet
    partition:
      validation_fraction: 0.2
phases:
  behavior_cloning:
    algorithm: policy_imitation
    sources:
    - source: demonstrations.train
    batch_size: 64
    optimization:
      actor:
        learning_rate: 0.005
    model_selection:
      handoff: last
    checkpoints:
      cadence:
        iterations: 1
    evaluation:
      cadence:
        iterations: 1
      batch_size: 64
      sources:
      - source: demonstrations.validation
    budget:
      epochs: 80
plan:
- behavior_cloning
