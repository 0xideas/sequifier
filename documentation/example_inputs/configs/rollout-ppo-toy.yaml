rollout:
  trajectory_path: outputs/ppo-rollout.json
  seed_row_index: 0
  max_episode_steps: 8
  max_steps: 8
  environment:
    factory: sequifier.rl.control:CategoricalControlAdapter
    config:
      horizon: 8
action_selection: deterministic
task: policy
run:
  project_root: .
  execution:
    device: cpu
  reproducibility:
    enforce_determinism: true
artifact:
  paths:
  - models/online-ppo.pt
input:
  path: documentation/example_inputs/ppo-observations.csv
  format: csv
