project_root: .
model_path: models/online-ppo/actor.pt
data_path: documentation/example_inputs/ppo-observations.csv
model_type: generative
read_format: csv
write_format: csv
device: cpu
deterministic: true
autoregressive: true
generation_steps: 8
rollout:
  mode: policy
  adapter:
    factory: sequifier.rl.control:ControlRolloutAdapter
    config: {horizon: 8}
  bindings:
    - {input: cue, source: environment, key: cue}
  trajectory_path: outputs/ppo-rollout.json
  seed_index: 0
  max_episode_steps: 8
